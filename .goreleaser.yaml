# GoReleaser v2 configuration for Athar.
version: 2

project_name: athar

before:
  hooks:
    - go mod download

builds:
  - id: athar
    main: ./cmd/athar
    binary: athar
    env:
      - CGO_ENABLED=0
    # Athar is a Windows tool (spec §1).
    goos: [windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - id: athar
    # The bare athar.exe (the archive lives next to it).
    formats: [binary]
    name_template: "athar_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - id: minisign
    artifacts: checksum
    cmd: go
    args: ["run", "./tools/sign", "${artifact}", "${signature}"]
    signature: "${artifact}.minisig"
    # tools/sign reads MINISIGN_PRIVATE_KEY (single-line base64 key) from the
    # environment inherited from the release job.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: AbuDergham
    name: Athar
  draft: false
  prerelease: auto
